column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"

# The application's own API is written with table-call syntax throughout
# (a command is registered by passing a single table without parentheses).
# Keeping that idiom means our code reads like every other extension.
call_parentheses = "NoSingleTable"
